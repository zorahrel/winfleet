<!doctype html>
<html lang="it" data-font="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC di casa</title>
<!--
  Schermo del PC di casa: lavoro in corso, stato del PC, conto allo standby.
  Tecnico e minimale: fondo piatto, filetti sottili, poche parole. Niente WebGL e niente animazioni
  (la GPU resta a riposo, il PC puo' andare in standby). Gira da file:// senza rete.
  Font (SIL OFL 1.1, file in fonts/ con le licenze):
    ?font=1  Mona Sans (predefinito: numeri Expanded Black, etichette strette)
    ?font=2  Hubot Sans
    ?font=3  Archivo
  Stato: stato.js (window.STATO), ricaricato ogni 2 s. ?stato=lavora|attesa legge le istantanee
  stato-lavora.js / stato-attesa.js e le riporta all'ora attuale.
  ?misura=1 scrive in <pre id="misura"> sovrapposizioni ed elementi fuori schermo.
-->
<style>
@font-face{font-family:"Hubot Sans";src:url("fonts/HubotSans%5Bwdth,wght%5D.ttf") format("truetype");
  font-weight:200 900;font-stretch:75% 125%;font-display:block}
@font-face{font-family:"Mona Sans";src:url("fonts/MonaSans%5Bwdth,wght%5D.ttf") format("truetype");
  font-weight:200 900;font-stretch:75% 125%;font-display:block}
@font-face{font-family:"Archivo";src:url("fonts/Archivo%5Bwdth,wght%5D.ttf") format("truetype");
  font-weight:100 900;font-stretch:62% 125%;font-display:block}

:root{
  --nero:#0a0b0a; --carta:#eceae0; --grigio:#8c8b82; --filo:rgba(236,234,224,.16);
  --lime:#d2f43a; --arancio:#ff6a1f; --rosso:#ff5a48;
  --accento:var(--lime);
  /* 1vh = 10,8 px a 1080p. Etichette 2,8vh (30 px), testi 4,4vh */
  --pad-x:6vw; --pad-y:6vh;
  --et:2.8vh; --testo-t:4.4vh;
  --display:"Mona Sans"; --corpo:"Mona Sans";
}
:root[data-font="2"]{ --display:"Hubot Sans"; --corpo:"Hubot Sans" }
:root[data-font="3"]{ --display:"Archivo"; --corpo:"Archivo" }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--nero);color:var(--carta)}
body{font-family:var(--corpo),"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-weight:600;
  -webkit-font-smoothing:antialiased;cursor:none;user-select:none}
body.attesa{--accento:var(--arancio)}
ol{list-style:none}
.n{font-variant-numeric:tabular-nums lining-nums}

#scena{position:fixed;inset:0;padding:var(--pad-y) var(--pad-x);display:flex;flex-direction:column;
  transition:transform 6s ease-in-out}
/* etichetta tecnica: maiuscolo stretto, spaziato, grigio */
.et{font-size:var(--et);font-weight:600;font-stretch:80%;letter-spacing:.16em;text-transform:uppercase;color:var(--grigio);line-height:1}

.testa{display:flex;justify-content:space-between;align-items:center;padding-bottom:2.6vh;border-bottom:1px solid var(--filo)}
.stato{display:flex;align-items:center;gap:1.1vw;color:var(--accento)}
.stato i{width:1.5vh;height:1.5vh;background:var(--accento);display:block}
.testa .dx{display:flex;gap:3vw;align-items:center}
#fermi{color:var(--rosso)}
#ora{color:var(--carta)}

.vista{flex:1;display:none;min-height:0;flex-direction:column;justify-content:center}
.lavora #v-lavora,.attesa #v-attesa{display:flex}

/* il numero grande: Expanded Black, e' l'unica cosa che conta */
.grande{font-family:var(--display),sans-serif;font-weight:900;font-stretch:125%;line-height:.82;
  letter-spacing:-.025em;color:var(--carta);white-space:nowrap;width:max-content}
.grande .u{font-size:.2em;font-weight:700;font-stretch:90%;letter-spacing:.04em;color:var(--accento);margin:0 .5em 0 .2em}
.grande .u:last-child{margin-right:0}
.grande .sep{color:var(--accento);letter-spacing:0;margin:0 .05em}
#durata{font-size:23vh}
#frase{font-size:var(--testo-t);font-weight:700;line-height:1.15;margin-top:5vh;max-width:80vw;
  text-wrap:balance;overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* filetto di avanzamento del conto */
#barra{flex:none;height:.6vh;min-height:4px;background:var(--filo);margin-top:4vh;position:relative}
#barra b{position:absolute;left:0;top:0;bottom:0;background:var(--accento)}
.k{margin:3vh 0 3.4vh}

/* riga dei dati: celle con etichetta sopra e valore sotto, separate da filetti */
.celle{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--filo)}
.celle>div{padding:2.6vh 2vw 0 0;min-width:0}
.celle>div+div{padding-left:2vw;border-left:1px solid var(--filo)}
.celle .v{font-size:var(--testo-t);font-weight:700;line-height:1.1;margin-top:1.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.celle .v small{font-size:.6em;color:var(--grigio);font-weight:600;margin-left:.2em}
.celle .m{height:.5vh;background:var(--filo);margin-top:1.4vh}
.celle .m b{display:block;height:100%;background:var(--carta)}

/* ultimi lavori: una riga l'uno */
#ultimi{margin:4vh 0 3vh;border-top:1px solid var(--filo)}
#ultimi li{display:grid;grid-template-columns:11vw 1fr auto;column-gap:2vw;align-items:baseline;
  padding:1.9vh 0;border-bottom:1px solid var(--filo);font-size:var(--testo-t);font-weight:600;line-height:1.1}
#ultimi .ok{color:var(--lime)} #ultimi .ko{color:var(--rosso)}
#ultimi .e{font-size:var(--et);font-weight:700;font-stretch:80%;letter-spacing:.14em;text-transform:uppercase}
#ultimi .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ultimi .d{color:var(--grigio)}
#perche{display:none;font-size:var(--testo-t);font-weight:600;line-height:1.2;margin-top:5vh;max-width:70vw;text-wrap:balance}
.senza-conto #perche{display:block}
.senza-conto #barra{display:none}
.senza-conto #conto .sep,.senza-conto #conto-u{display:none}
</style>
</head>
<body class="vuoto">
<main id="scena">
  <header class="testa">
    <span class="et stato"><i></i><span id="testa-stato">PC di casa</span></span>
    <span class="dx"><span class="et" id="fermi"></span><span class="et n" id="ora" style="color:var(--carta)">--:--</span></span>
  </header>

  <section class="vista" id="v-lavora">
    <div class="grande" id="durata"></div>
    <p id="frase"></p>
  </section>

  <section class="vista" id="v-attesa">
    <p class="et k" id="k-attesa">Standby tra</p>
    <div class="grande" id="conto" style="font-size:30vh"></div>
    <div id="barra"><b id="barra-in"></b></div>
    <p id="perche"></p>
    <ol id="ultimi"></ol>
  </section>

  <footer class="celle" id="celle"></footer>
</main>

<script src="nome-lavoro.js"></script>
<script>
const q = new URLSearchParams(location.search);
const FONT = ['1','2','3'].includes(q.get('font')) ? q.get('font') : '1';
document.documentElement.dataset.font = FONT;
const DEMO = ['lavora','attesa'].includes(q.get('stato')) ? q.get('stato') : null;
const FILE = DEMO ? `stato-${DEMO}.js` : 'stato.js';

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pulisci = t => String(t || '').trim().replace(/[.\s]+$/, '');
/* avvolge le cifre in .n: tabular-nums solo lì */
const cifre = t => esc(t).replace(/\d+/g, d => `<span class="n">${d}</span>`);

/* ---------- dati ----------
   scarto: in modo istantanea (?stato=) l'ora dei dati è nel passato, la riportiamo al caricamento;
   con stato.js vero è lo stesso PC che lo scrive, quindi scarto = 0 e vale l'orologio di sistema. */
let dati = null, firma = '', scarto = 0, mancante = false;
const adesso = () => Date.now() - scarto;

function prendi(){
  const S = window.STATO;
  if (!S || typeof S !== 'object') return;
  const f = JSON.stringify(S);
  if (f === firma) return;
  if (DEMO && !dati) scarto = Date.now() - (Date.parse(S.ora) || Date.now());
  firma = f; dati = S; mancante = false;
  disegna();
}
function carica(){
  const s = document.createElement('script');
  s.src = FILE + '?t=' + Date.now();
  s.onload = () => { s.remove(); prendi(); };
  s.onerror = () => { s.remove(); if (!dati) { mancante = true; disegna(); } };
  document.head.appendChild(s);
}

/* ---------- formati ---------- */
const hhmm = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
function durataHTML(s){
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  const n = v => `<span class="n">${v}</span>`, u = v => `<span class="u">${v}</span>`;
  if (h) return `${n(h)}${u('h')}${n(String(m).padStart(2,'0'))}${u('min')}`;
  if (m) return `${n(m)}${u('min')}${n(String(r).padStart(2,'0'))}${u('s')}`;
  return `${n(r)}${u('s')}`;
}
function lunghezza(s){
  s = Math.round(s);
  if (s < 60) return `${s}\u00a0s`;
  const m = Math.floor(s / 60), r = s % 60;
  return r ? `${m}\u00a0min ${r}\u00a0s` : `${m}\u00a0min`;
}
function fa(s){
  if (s < 90) return 'poco fa';
  const m = Math.round(s / 60);
  if (m < 60) return `${m}\u00a0minuti\u00a0fa`;
  const h = Math.round(m / 60);
  return h === 1 ? 'un’ora fa' : `${h} ore fa`;
}
function ultimiDi(s){ return Array.isArray(s.esiti) ? s.esiti : (Array.isArray(s.ultimi) ? s.ultimi : []); }
function lavoriDi(s){
  const l = Array.isArray(s.lavori) && s.lavori.length ? s.lavori : (s.lavoro ? [s.lavoro] : []);
  return l.slice().sort((a, b) => (Date.parse(a.da) || 0) - (Date.parse(b.da) || 0));
}

/* ---------- disegno ---------- */
let soglia = 20, fineAlle = null;
const cella = (k, v, m) => `<div><p class="et">${k}</p><p class="v">${v}</p>${m == null ? '' : `<div class="m"><b style="width:${Math.max(0, Math.min(100, m))}%"></b></div>`}</div>`;
function celle(s, L, altri){
  const r = s.risorse || {}, c = [];
  if (L) {
    const da = Date.parse(L.da);
    if (!isNaN(da)) c.push(cella('Dalle', cifre(hhmm(da + scarto))));
    c.push(cella('Da', esc(L.chi || 'un agente')));
    if (altri) c.push(cella('In coda', cifre(altri)));
  }
  if (r.cpu != null) c.push(cella('CPU', cifre(Math.round(r.cpu)) + '<small>%</small>', r.cpu));
  if (r.gpu != null) c.push(cella('GPU', cifre(Math.round(r.gpu)) + '<small>%</small>', r.gpu));
  if (r.ram_usata_gb != null && r.ram_totale_gb) c.push(cella('RAM', cifre(Math.round(r.ram_usata_gb)) + '<small>/ ' + cifre(Math.round(r.ram_totale_gb)) + ' GB</small>', 100 * r.ram_usata_gb / r.ram_totale_gb));
  $('celle').innerHTML = c.join('');
}
const contoHTML = s => {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return `<span class="n">${m}</span><span class="sep">:</span><span class="n">${String(r).padStart(2,'0')}</span><span class="u" id="conto-u">min</span>`;
};
function disegna(){
  if (!dati) {
    document.body.className = 'attesa vuoto senza-conto';
    $('testa-stato').textContent = 'PC di casa';
    $('k-attesa').textContent = 'In attesa di dati';
    $('conto').innerHTML = ''; $('perche').textContent = ''; $('ultimi').innerHTML = ''; $('celle').innerHTML = '';
    return;
  }
  const s = dati, lav = lavoriDi(s), esiti = ultimiDi(s);
  if (lav.length) {
    document.body.className = 'lavora';
    const L = lav[0];
    const mostra = window.NomeLavoro ? NomeLavoro.nomeLavoro(L) : { titolo: L.cosa, progetto: L.progetto };
    $('testa-stato').textContent = 'Al lavoro';
    $('frase').innerHTML = cifre(pulisci(mostra.titolo) || 'Un lavoro mandato dal Mac');
    celle(s, L, lav.length - 1 + (s.coda || []).length);
  } else {
    const sp = s.sospensione || {};
    soglia = sp.soglia_minuti || s.sogliaMinuti || 20;
    if (typeof s.sospendeAlle === 'number') fineAlle = s.sospendeAlle;
    else if (sp.minuti_mancanti != null) fineAlle = (Date.parse(s.ora) || adesso()) + sp.minuti_mancanti * 60000;
    else fineAlle = null;
    document.body.className = 'attesa' + (fineAlle == null ? ' senza-conto' : '');
    $('testa-stato').textContent = 'Libero';
    const motivo = sp.perche_sveglio || (Array.isArray(s.motivi) && s.motivi.join(', ')) || '';
    $('k-attesa').textContent = fineAlle == null ? 'Resta acceso' : 'Standby tra';
    $('perche').innerHTML = fineAlle == null ? cifre(motivo || 'Qualcosa lo tiene sveglio.') : '';
    if (fineAlle == null) $('conto').innerHTML = '';
    $('ultimi').innerHTML = esiti.slice(0, 3).map(u => {
      const ok = u.esito === 'ok', mostra = window.NomeLavoro ? NomeLavoro.nomeLavoro(u) : { titolo: u.cosa };
      const et = ok ? 'ok' : u.esito === 'interrotto' ? 'stop' : 'ko';
      return `<li><span class="e ${ok ? 'ok' : 'ko'}">${et}</span><span class="c">${cifre(pulisci(mostra.titolo) || 'Un lavoro mandato dal Mac')}</span><span class="d">${cifre(lunghezza(u.secondi || 0))}</span></li>`;
    }).join('');
    celle(s, null, 0);
  }
  tic();
}

/* ogni secondo: orologio, dati fermi, durata, conto alla rovescia */
function tic(){
  $('ora').innerHTML = cifre(hhmm(Date.now()));
  if (!dati) { $('fermi').textContent = ''; return; }
  const vecchio = adesso() - (Date.parse(dati.ora) || adesso());
  $('fermi').textContent = vecchio > 120000 ? `dati fermi da ${Math.floor(vecchio / 60000)} min` : '';
  if (document.body.classList.contains('lavora')) {
    const L = lavoriDi(dati)[0];
    $('durata').innerHTML = durataHTML((adesso() - Date.parse(L.da)) / 1000);
    return;
  }
  if (fineAlle == null) return;
  const resto = Math.max(0, (fineAlle - adesso()) / 1000);
  $('conto').innerHTML = contoHTML(Math.ceil(resto));
  $('k-attesa').textContent = resto > 0 ? 'Standby tra' : 'Sta andando in standby';
  $('barra-in').style.width = (100 * (1 - Math.min(1, resto / (soglia * 60)))) + '%';
}

/* il testo si sposta di pochi pixel ogni tanto, contro il segno sullo schermo */
function spostaScena(){
  const r = () => Math.round((Math.random() * 2 - 1) * 7);
  $('scena').style.transform = `translate(${r()}px, ${r()}px)`;
}

/* ---------- misura del DOM (?misura=1) ----------
   rettangoli reali dei testi (Range sui nodi di testo visibili): coppie di nodi diversi che si
   toccano oltre 1 px e testi che escono dallo schermo. */
function misura(){
  const W = innerWidth, H = innerHeight, testi = [];
  const w = document.createTreeWalker($('scena'), NodeFilter.SHOW_TEXT);
  let id = 0;
  while (w.nextNode()) {
    const nodo = w.currentNode, el = nodo.parentElement;
    if (!nodo.textContent.trim() || !el.checkVisibility()) continue;
    const r = document.createRange(); r.selectNodeContents(nodo);
    const lh = parseFloat(getComputedStyle(el).lineHeight);
    id++;
    for (const b of r.getClientRects()) if (b.width > 1 && b.height > 1) {
      const meta = isNaN(lh) ? 0 : Math.max(0, (b.height - lh) / 2);
      testi.push({id, t: nodo.textContent.trim().slice(0, 28), x: b.left, y: b.top + meta, r: b.right, b: b.bottom - meta});
    }
  }
  const sovra = [], fuori = [];
  for (let i = 0; i < testi.length; i++) {
    const a = testi[i];
    if (a.x < 0 || a.y < 0 || a.r > W || a.b > H) fuori.push(a.t);
    for (let j = i + 1; j < testi.length; j++) {
      const b = testi[j];
      if (a.id === b.id) continue;
      const ox = Math.min(a.r, b.r) - Math.max(a.x, b.x), oy = Math.min(a.b, b.b) - Math.max(a.y, b.y);
      if (ox > 1 && oy > 1) sovra.push(`${a.t} × ${b.t} (${ox.toFixed(0)}×${oy.toFixed(0)} px)`);
    }
  }
  
  const out = {W, H, font: FONT, stato: document.body.className,
    fontCaricati: [...document.fonts].filter(f => f.status === 'loaded').map(f => f.family),
    testi: testi.length, sovrapposizioni: sovra, fuori,
    conto: $('conto').checkVisibility() ? $('conto').textContent : null};
  let pre = $('misura');
  if (!pre) { pre = document.createElement('pre'); pre.id = 'misura'; pre.style.display = 'none'; document.body.appendChild(pre); }
  pre.textContent = JSON.stringify(out);
}

/* ---------- avvio ---------- */
/* i font si caricano solo quando un testo li usa: li chiediamo subito */
const famiglia = {'1': 'Mona Sans', '2': 'Hubot Sans', '3': 'Archivo'}[FONT];
const pronti = document.fonts
  ? Promise.all([900, 700, 600].map(w => document.fonts.load(`${w} 40px "${famiglia}"`))).catch(() => {})
  : Promise.resolve();
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { if (dati) disegna(); });
addEventListener('resize', () => { if (dati) disegna(); });
pronti.then(() => {
  carica();
  if (q.get('misura')) setTimeout(misura, 2500);
});
setInterval(tic, 1000);
setInterval(carica, 2000);
setInterval(spostaScena, 80000);
</script>
</body>
</html>
